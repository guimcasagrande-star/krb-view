[package]
name = "visualizador-dicom"
version = "0.1.0"
description = "Visualizador DICOM pessoal (uso pessoal/estudo; não validado para diagnóstico)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
base64 = "0.22"
