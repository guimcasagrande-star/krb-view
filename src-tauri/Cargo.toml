[package]
name = "visualizador-dicom"
version = "0.1.3"
description = "KRB View — Visualizador DICOM pessoal (uso pessoal/estudo; não validado para diagnóstico)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tokio = { version = "1", features = ["fs", "net", "io-util", "time", "sync"] }
base64 = "0.22"
# Conexão segura com o PACS (DICOM TLS): TLS do próprio Windows (schannel) e SHA-256 do certificado.
native-tls = "0.2"
tokio-native-tls = "0.3"
sha2 = "0.10"
